<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#0d2137"/>
      <stop offset="100%" style="stop-color:#112d4e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Decorative key (left) -->
  <g transform="translate(100, 120) rotate(90 60 60)" opacity="0.07">
    <circle cx="60" cy="60" r="58" fill="#ffffff"/>
    <circle cx="60" cy="60" r="24" fill="#0a1628"/>
    <rect x="112" y="46" width="170" height="28" rx="6" fill="#ffffff"/>
    <rect x="226" y="70" width="22" height="40" rx="4" fill="#ffffff"/>
    <rect x="258" y="70" width="22" height="28" rx="4" fill="#ffffff"/>
  </g>

  <!-- Decorative sign-in door with an arrow (right) -->
  <g transform="translate(1040, 210) scale(0.85)" opacity="0.06">
    <path d="M100 0 H200 A16 16 0 0 1 216 16 V224 A16 16 0 0 1 200 240 H100" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="120" x2="140" y2="120" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
    <polyline points="92,72 140,120 92,168" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Accent line -->
  <rect x="440" y="200" width="80" height="4" rx="2" fill="url(#accent)"/>

  <!-- Package name -->
  <text x="640" y="270" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-2">Dev Login for Laravel</text>

  <!-- Tagline -->
  <text x="640" y="330" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#8899aa" letter-spacing="1">Sign in as any user with one URL · off until you switch it on</text>

  <!-- Feature pills -->
  <g transform="translate(640, 385)" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500">
    <rect x="-367" y="-16" width="89" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1"/>
    <text x="-322.5" y="5" fill="#a5f3fc">One URL</text>
    <rect x="-264" y="-16" width="97" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1"/>
    <text x="-215.5" y="5" fill="#a5f3fc">Any user</text>
    <rect x="-153" y="-16" width="127" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1"/>
    <text x="-89.5" y="5" fill="#a5f3fc">Switch-gated</text>
    <rect x="-12" y="-16" width="135" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1"/>
    <text x="55.5" y="5" fill="#a5f3fc">dev-login:url</text>
    <rect x="137" y="-16" width="112" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1"/>
    <text x="193" y="5" fill="#a5f3fc">Playwright</text>
    <rect x="263" y="-16" width="104" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1"/>
    <text x="315" y="5" fill="#a5f3fc">AI agents</text>
  </g>

  <!-- NETipar text branding -->
  <g transform="translate(640, 460)" text-anchor="middle" opacity="0.3">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#ffffff" letter-spacing="3">NETipar</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="630" width="1280" height="10" fill="url(#accent)"/>
</svg>
